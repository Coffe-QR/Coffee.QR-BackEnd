<html>
<head>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #fff5e6;
            color: #3e2723;
            margin: 0;
            padding: 0;
        }

        .email-container {
            max-width: 600px;
            margin: auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .header, .footer {
            background-color: #6d4c41;
            color: white;
            padding: 10px;
            text-align: center;
        }

        .content {
            padding: 20px;
        }

        img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 10px auto;
        }

        .footer img {
            max-width: 50px; /* Smaller size for the logo in the footer */
        }

        .footer p {
            font-size: 12px;
            margin: 5px;
        }
    </style>
</head>
<body>
    <div class="email-container">
        <div class="header">
            <!-- Adjust image size directly in the style attribute or use classes -->
            <img src="CID:logoWhite" alt="Coffee QR Logo" style="max-width: 150px;">
        </div>
        <div class="content">
            <p>Hello, Customer!</p>
            <p>Thank you for using our app.</p>
            <p>{TicketDetails}>
        </div>
        <div class="footer">
            <p>App is powered by FatManTeam</p>
            <img src="CID:fatmanqrLogo" alt="FatManTeam Logo">
        </div>
    </div>
</body>
</html>
